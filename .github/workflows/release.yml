name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            bin: sinapse.exe
            asset: sinapse-win-x64.exe
          - os: ubuntu-22.04 # older glibc, runs on current Fedora
            rid: linux-x64
            bin: sinapse
            asset: sinapse-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >
          dotnet publish src/Sinapse -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:InvariantGlobalization=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${GITHUB_REF_NAME#v} -o publish
      - run: mv publish/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            sinapse.example.json
